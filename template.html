<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Language Tree</title>
<style>
  :root {
    --pink: #ff8fc7;
    --pale: #ffd6ec;
    --deep: #ff5fa8;
    --ink: #1c0d2e;
    --text: #fff0f8;
    --muted: #cfa6c0;
    --good: #8ff0c8;
    --bad: #ff7a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 0%, #2d1344 0%, #140a24 55%, #07040f 100%);
  }

  /* ---------- timeline (behind the tree) ---------- */
  #timeline { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .tick { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
  .tick .yr { position: absolute; left: 12px; top: -9px; font-size: 12px; letter-spacing: .06em; color: var(--pale); opacity: .8; }
  .tick .rule { position: absolute; left: 60px; right: 0; top: 0; border-top: 1px dashed rgba(255, 143, 199, .17); }

  /* ---------- the tree ---------- */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }

  .node { cursor: pointer; outline: none; }
  .node .body { transform-box: fill-box; transform-origin: center; transition: transform .25s; }
  .node:hover .body, .node:focus-visible .body { transform: scale(1.09); }
  .node .name { fill: #2a0f3d; font-size: 13.5px; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .halo { animation: breathe 4.5s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
  .twinkle { animation: tw 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  .leaves { opacity: 0; pointer-events: none; transition: opacity .35s; }
  .leaves.show { opacity: 1; pointer-events: auto; }
  .lesson-leaf { cursor: pointer; }
  .lesson-leaf .shape { fill: rgba(255, 143, 199, .22); stroke: var(--pink); stroke-width: 2; transition: fill .2s; }
  .lesson-leaf .rib { stroke: var(--pale); stroke-width: 1.2; opacity: .35; fill: none; }
  .lesson-leaf:hover .shape { fill: rgba(255, 143, 199, .5); }
  .lesson-leaf .glyph { fill: #fff; font-size: 14px; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .lesson-leaf .lab { fill: var(--pale); font-size: 10px; text-anchor: middle; pointer-events: none; opacity: .95; }

  /* ---------- zoom buttons ---------- */
  #controls { position: fixed; right: 16px; bottom: 16px; z-index: 3; display: flex; flex-direction: column; gap: 8px; }
  .cbtn {
    width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--pink);
    background: rgba(28, 13, 46, .85); color: var(--text); font-size: 20px; cursor: pointer; font-family: inherit;
    box-shadow: 0 0 14px rgba(255, 143, 199, .4);
  }
  .cbtn:hover, .cbtn:focus-visible { background: #3a1a58; outline: none; }

  /* ---------- lesson overlay ---------- */
  #lesson { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(7, 4, 15, .62); backdrop-filter: blur(6px); padding: 14px; }
  #lesson[hidden] { display: none; }
  #card {
    position: relative; width: min(660px, 100%); max-height: 94vh; overflow: auto;
    background: rgba(32, 14, 52, .96); border: 1.5px solid rgba(255, 143, 199, .6); border-radius: 24px;
    padding: 20px 20px 24px; box-shadow: 0 0 40px rgba(255, 143, 199, .3);
  }
  #close { position: absolute; top: 12px; right: 12px; }
  #lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-right: 50px; }
  #lhead .mini { width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff2f9 0%, #ff9fd0 45%, #ff5fa8 100%); box-shadow: 0 0 16px var(--pink); }
  #lhead h2 { font-size: 1.35rem; text-shadow: 0 0 14px rgba(255, 143, 199, .6); }
  .row { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    border: 1.5px solid rgba(255, 143, 199, .55); background: transparent; color: var(--text);
    border-radius: 999px; padding: 4px 13px; font-size: .85rem; cursor: pointer; font-family: inherit;
  }
  .chip:hover, .chip:focus-visible { border-color: var(--pink); box-shadow: 0 0 10px rgba(255, 143, 199, .5); outline: none; }
  .chip.on { background: var(--pink); color: var(--ink); border-color: var(--pink); font-weight: 700; }

  #dots { display: flex; gap: 8px; margin: 16px 0 6px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--pink); transition: background .3s, box-shadow .3s; }
  .dot.here { box-shadow: 0 0 8px var(--pink); }
  .dot.done { background: var(--good); border-color: var(--good); box-shadow: 0 0 8px var(--good); }

  .goal { font-size: 1.15rem; font-weight: 700; color: var(--pale); margin: 8px 0 4px; }
  pre.code {
    background: #12081f; border: 1px solid rgba(255, 143, 199, .25); border-radius: 14px;
    padding: 12px 6px; overflow-x: auto; font-family: Consolas, Monaco, "Courier New", monospace;
    font-size: .95rem; line-height: 1.9; color: #ffe6f3; margin: 10px 0 14px; white-space: pre;
  }
  .ln { padding: 0 14px; min-height: 1.9em; }

  .slot {
    display: inline-block; min-width: 3.2ch; text-align: center; padding: 0 8px; border-radius: 8px;
    border: 1.5px dashed var(--pink); color: var(--pink); animation: breathe 1.6s ease-in-out infinite;
  }
  .slot.filled { animation: none; border-style: solid; color: var(--ink); background: var(--pink); font-weight: 700; }
  .slot.ok { background: var(--good); border-color: var(--good); box-shadow: 0 0 14px var(--good); }
  .slot.bad { background: var(--bad); border-color: var(--bad); box-shadow: 0 0 14px var(--bad); animation: shake .35s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .tiles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .tile {
    border: 2px solid var(--pink); background: transparent; color: var(--text); border-radius: 14px;
    padding: 9px 22px; font-size: 1.1rem; font-family: Consolas, Monaco, "Courier New", monospace; cursor: pointer;
  }
  .tile:hover:not(:disabled), .tile:focus-visible { background: #3a1a58; box-shadow: 0 0 14px rgba(255, 143, 199, .5); outline: none; }
  .tile.sel { background: var(--pink); color: var(--ink); font-weight: 700; }
  .tile.sel.ok { background: var(--good); border-color: var(--good); }
  .tile.sel.bad { background: var(--bad); border-color: var(--bad); }
  .tile:disabled { cursor: default; opacity: .55; }
  .tile.sel:disabled { opacity: 1; }

  #fb { min-height: 96px; margin-top: 14px; text-align: center; }
  .sim { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; min-height: 44px; margin-bottom: 8px; }
  .simlabel { color: var(--muted); font-size: .85rem; }
  .badge { background: #12081f; border: 1.5px solid var(--pink); border-radius: 12px; padding: 5px 13px;
    font-family: Consolas, Monaco, monospace; font-size: 1.05rem; color: var(--pale); animation: pop .35s ease backwards; }
  .badge.good { border-color: var(--good); color: var(--good); }
  .badge.bad { border-color: var(--bad); color: var(--bad); }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  .msg { font-size: 1rem; line-height: 1.5; }
  .msg.good { color: var(--good); }
  .msg.oops { color: #ffb0bb; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; min-height: 44px; flex-wrap: wrap; }
  .big {
    border: none; border-radius: 999px; padding: 10px 24px; font-size: 1rem; font-weight: 700; cursor: pointer;
    background: var(--pink); color: var(--ink); font-family: inherit; box-shadow: 0 0 18px rgba(255, 143, 199, .55);
    animation: pop .35s ease backwards;
  }
  .big.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--pink); box-shadow: none; }
  .big:active { transform: scale(.96); }
  .done-card { text-align: center; padding: 24px 0 8px; }
  .done-card .check { font-size: 3.2rem; color: var(--good); text-shadow: 0 0 20px var(--good); animation: pop .5s ease backwards; }
  .done-card .nice { font-size: 1.3rem; font-weight: 700; margin-top: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .halo, .twinkle, .slot, .badge, .big { animation: none !important; }
  }
</style>
</head>
<body>

<div id="timeline"></div>

<svg id="stage" role="group" aria-label="Programming language tree">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-400" y="-900" width="3000" height="3000">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#fff2f9"/>
      <stop offset="0.45" stop-color="#ff9fd0"/>
      <stop offset="1" stop-color="#ff5fa8"/>
    </radialGradient>
    <linearGradient id="stemFill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fc7" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8fc7" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g id="world">
    <g id="sparkles"></g>
    <g id="halo" filter="url(#blur)"></g>
    <g id="branches"></g>
    <g id="twigs"></g>
    <g id="nodes"></g>
    <g id="leafLayer"></g>
  </g>
</svg>

<div id="controls">
  <button class="cbtn" id="zin" aria-label="Zoom in">+</button>
  <button class="cbtn" id="zout" aria-label="Zoom out">−</button>
  <button class="cbtn" id="zfit" aria-label="Show whole tree">⌂</button>
</div>

<div id="lesson" hidden>
  <div id="card">
    <button class="cbtn" id="close" aria-label="Close">✕</button>
    <div id="lhead"></div>
    <div class="row" id="kindPills"></div>
    <div id="dots"></div>
    <div id="lbody"></div>
  </div>
</div>

<script>
(function () {
const D = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const TL = 64;                          // width reserved for the timeline labels
const PINK = "#ff8fc7", PALE = "#ffd6ec", DEEP = "#ff5fa8";
const R = 36;                           // orb radius
const BLANK = "{{0}}";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function S(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function H(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = rng(7);
const f1 = v => Math.round(v * 10) / 10;

const stage = $("stage"), world = $("world");
const byId = {}, kids = {};
D.nodes.forEach(n => { byId[n.id] = n; kids[n.id] = []; });
D.nodes.forEach(n => { if (n.parent) kids[n.parent].push(n); });
function sizeOf(n) { return 1 + kids[n.id].reduce((s, c) => s + sizeOf(c), 0); }
D.nodes.forEach(n => { n.size = sizeOf(n); n.thick = 5.5 + 7.5 * Math.sqrt(n.size); });

/* ================= geometry helpers ================= */
function bezPt(p0, c1, c2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p3.y
  };
}
function sample(p0, c1, c2, p3, steps) {
  const pts = [];
  for (let i = 0; i <= steps; i++) pts.push(bezPt(p0, c1, c2, p3, i / steps));
  return pts;
}
// polyline offset by a fraction of the (tapering) width; side = 0 means the centre line
function edgeLine(pts, w0, w1, frac) {
  const out = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b.x - a.x, ty = b.y - a.y;
    const len = Math.hypot(tx, ty) || 1; tx /= len; ty /= len;
    const w = (w0 + (w1 - w0) * (i / (n - 1))) / 2 * frac;
    out.push({ x: pts[i].x - ty * w, y: pts[i].y + tx * w });
  }
  return out;
}
function ribbon(pts, w0, w1) {
  const L = edgeLine(pts, w0, w1, 1), Rr = edgeLine(pts, w0, w1, -1).reverse();
  return "M" + L.concat(Rr).map(p => f1(p.x) + "," + f1(p.y)).join("L") + "Z";
}
function line(pts) { return "M" + pts.map(p => f1(p.x) + "," + f1(p.y)).join("L"); }

const LEAF_COLORS = [PALE, PINK, "#ffb3d9", "#ff9aa8", PALE];
function leaf(parent, x, y, ang, s, op) {
  const e = S("path", {
    d: "M0,0 C0.28,-0.5 0.78,-0.55 1,0 C0.78,0.55 0.28,0.5 0,0Z",
    transform: "translate(" + f1(x) + "," + f1(y) + ") rotate(" + f1(ang * 180 / Math.PI) + ") scale(" + f1(s) + ")",
    fill: LEAF_COLORS[Math.floor(rand() * LEAF_COLORS.length)], "fill-opacity": op
  }, parent);
  if (rand() < 0.3) { e.setAttribute("class", "twinkle"); e.style.setProperty("--d", (rand() * 3).toFixed(2) + "s"); }
  return e;
}
function twig(parent, x, y, ang, len, w) {
  const bend = (rand() - 0.5) * 0.9;
  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  const cx = x + Math.cos(ang + bend) * len * 0.55, cy = y + Math.sin(ang + bend) * len * 0.55;
  S("path", { d: "M" + f1(x) + "," + f1(y) + " Q" + f1(cx) + "," + f1(cy) + " " + f1(ex) + "," + f1(ey),
    fill: "none", stroke: PINK, "stroke-width": w, "stroke-opacity": 0.7, "stroke-linecap": "round" }, parent);
  const mx = 0.25 * x + 0.5 * cx + 0.25 * ex, my = 0.25 * y + 0.5 * cy + 0.25 * ey;
  leaf(parent, mx, my, ang + (rand() < 0.5 ? -0.9 : 0.9), 13 + rand() * 7, 0.75);
  leaf(parent, ex, ey, ang - 0.55, 14 + rand() * 9, 0.85);
  leaf(parent, ex, ey, ang + 0.55, 12 + rand() * 9, 0.85);
  leaf(parent, ex, ey, ang, 11 + rand() * 8, 0.9);
  if (rand() < 0.6) {
    const c = S("circle", { cx: f1(ex + Math.cos(ang) * 8), cy: f1(ey + Math.sin(ang) * 8), r: 2 + rand() * 2, fill: PALE, class: "twinkle" }, parent);
    c.style.setProperty("--d", (rand() * 3).toFixed(2) + "s");
  }
}

/* ================= draw the tree ================= */
const haloG = $("halo"), branchG = $("branches"), twigG = $("twigs");
const root = D.nodes.find(n => !n.parent);

// trunk: comes in from above the screen and fades into the sky
(function () {
  const top = root.y - 800;
  const pts = sample({ x: root.x - 6, y: top }, { x: root.x + 18, y: top + 260 }, { x: root.x - 14, y: root.y - 260 }, { x: root.x, y: root.y }, 30);
  const grad = $("stage").querySelector("#stemFill");
  grad.setAttribute("y1", top); grad.setAttribute("y2", root.y - 60);
  S("path", { d: ribbon(pts, root.thick * 1.15, root.thick * 1.0), fill: "url(#stemFill)" }, branchG);
  S("path", { d: ribbon(pts, root.thick * 2.4, root.thick * 2.1), fill: PINK, "fill-opacity": 0.35 }, haloG);
})();

D.nodes.filter(n => n.parent).forEach(n => {
  const p = byId[n.parent];
  const dx = n.x - p.x, dy = n.y - p.y;
  const j = () => (rand() - 0.5) * 24;
  const c1 = { x: p.x + dx * 0.55 + j(), y: p.y + dy * 0.2 + j() };
  const c2 = { x: n.x + j() * 0.5, y: n.y - dy * 0.5 };
  const pts = sample(p, c1, c2, n, 30);
  const w0 = n.thick * 1.08, w1 = n.thick * 0.72;
  S("path", { d: ribbon(pts, w0 * 2.3, w1 * 2.3), fill: PINK, "fill-opacity": 0.32 }, haloG);
  S("path", { d: ribbon(pts, w0, w1), fill: PINK, "fill-opacity": 0.82 }, branchG);
  [-0.45, 0.4].forEach(fr => {
    S("path", { d: line(edgeLine(pts, w0, w1, fr)), fill: "none", stroke: DEEP, "stroke-opacity": 0.45, "stroke-width": 1.4, "stroke-linecap": "round" }, branchG);
  });
  S("path", { d: line(edgeLine(pts, w0, w1, 0.05)), fill: "none", stroke: PALE, "stroke-opacity": 0.55, "stroke-width": 2, "stroke-linecap": "round" }, branchG);

  // twigs and leaves growing off the branch
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  const count = clamp(Math.floor(len / 80), 1, 6);
  for (let i = 0; i < count; i++) {
    const idx = Math.floor((0.3 + 0.5 * (i + rand() * 0.6) / count) * (pts.length - 1));
    const a = pts[Math.max(0, idx - 1)], b = pts[Math.min(pts.length - 1, idx + 1)];
    const dir = Math.atan2(b.y - a.y, b.x - a.x);
    const side = i % 2 === 0 ? 1 : -1;
    const wAt = (w0 + (w1 - w0) * idx / (pts.length - 1)) / 2;
    const off = edgeLine(pts, w0, w1, side)[idx];
    twig(twigG, off.x, off.y, dir + side * (0.75 + rand() * 0.5), 38 + rand() * 46, 3);
  }
});

// canopy around the ends of the branches
D.nodes.filter(n => kids[n.id].length === 0).forEach(n => {
  for (let i = 0; i < 6; i++) {
    const ang = -0.15 * Math.PI + (i / 5) * 1.3 * Math.PI + (rand() - 0.5) * 0.3;
    twig(twigG, n.x + Math.cos(ang) * (R - 6), n.y + Math.sin(ang) * (R - 6), ang, 46 + rand() * 40, 3);
  }
});
// a few twigs at the first fork
for (let i = 0; i < 4; i++) {
  const side = i % 2 ? 1 : -1;
  twig(twigG, root.x + side * 14, root.y - 70 - i * 55, Math.PI / 2 + side * (0.9 + rand() * 0.5), 44 + rand() * 30, 3);
}

// sparkle dust
for (let i = 0; i < 90; i++) {
  const c = S("circle", { cx: f1(-100 + rand() * (D.width + 200)), cy: f1(-200 + rand() * (D.height + 300)), r: f1(0.8 + rand() * 1.6), fill: PALE, class: "twinkle" }, $("sparkles"));
  c.style.setProperty("--d", (rand() * 3).toFixed(2) + "s");
}

/* ----- the languages: glowing orbs ----- */
const nodesG = $("nodes");
D.nodes.forEach(n => {
  const g = S("g", { class: "node", transform: "translate(" + n.x + "," + n.y + ")", "data-id": n.id,
    tabindex: 0, role: "button", "aria-label": n.name }, nodesG);
  const body = S("g", { class: "body", filter: "url(#glow)" }, g);
  const halo = S("circle", { class: "halo", r: R + 16, fill: PINK, "fill-opacity": 0.22 }, body);
  halo.style.setProperty("--d", (rand() * 3).toFixed(2) + "s");
  S("circle", { r: R, fill: "url(#orb)", stroke: PALE, "stroke-width": 1.5, "stroke-opacity": 0.8 }, body);
  S("ellipse", { cx: -11, cy: -15, rx: 13, ry: 7, fill: "#fff", "fill-opacity": 0.45, transform: "rotate(-30 -11 -15)" }, body);
  S("text", { class: "name" }, g).textContent = n.name;
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); focusNode(n); } });
});

/* ----- lesson leaves that appear when you zoom in on an orb ----- */
const KINDS = [["types", "int", "types"], ["cond", "if", "if / else"], ["loop", "for", "loops"], ["fn", "ƒ", "functions"]];
const LEAF_ANGLES = [-160, 160, 20, -20];       // degrees, left pair and right pair
const leafGroups = {};
D.nodes.forEach(n => {
  const g = S("g", { class: "leaves", transform: "translate(" + n.x + "," + n.y + ")" }, $("leafLayer"));
  KINDS.forEach((k, i) => {
    const a = LEAF_ANGLES[i] * Math.PI / 180, rad = 112;
    const lg = S("g", { class: "lesson-leaf", transform: "translate(" + f1(Math.cos(a) * rad) + "," + f1(Math.sin(a) * rad) + ")",
      "data-node": n.id, "data-kind": k[0], filter: "url(#glow)", role: "button", "aria-label": k[2] }, g);
    const rot = S("g", { transform: "rotate(" + LEAF_ANGLES[i] + ")" }, lg);
    S("path", { class: "shape", d: "M-28,0 C-16,-25 16,-25 32,0 C16,25 -16,25 -28,0Z" }, rot);
    S("path", { class: "rib", d: "M-28,0 L26,0" }, rot);
    S("text", { class: "glyph", y: -2 }, lg).textContent = k[1];
    S("text", { class: "lab", y: 38 }, lg).textContent = k[2];
  });
  leafGroups[n.id] = g;
});

/* ================= timeline ================= */
const tl = $("timeline");
const ticks = D.years.map(yy => {
  const t = H("div", "tick");
  t.appendChild(H("div", "rule"));
  t.appendChild(H("span", "yr", String(yy.year)));
  tl.appendChild(t);
  return { el: t, y: yy.y };
});

/* ================= pan and zoom ================= */
let k = 1, tx = 0, ty = 0, fitK = 1, interacted = false, anim = 0;
let KMIN = 0.1;
const KMAX = 4;
const bb = {
  x0: Math.min.apply(null, D.nodes.map(n => n.x)) - 170, x1: Math.max.apply(null, D.nodes.map(n => n.x)) + 170,
  y0: Math.min.apply(null, D.nodes.map(n => n.y)) - 150, y1: Math.max.apply(null, D.nodes.map(n => n.y)) + 150
};

function apply() {
  world.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + k + ")");
  const hh = innerHeight;
  ticks.forEach(t => {
    const sy = ty + t.y * k;
    t.el.style.transform = "translateY(" + sy + "px)";
    t.el.style.display = (sy < -20 || sy > hh + 20) ? "none" : "block";
  });
  updateLeaves();
}
function center() { return { x: TL + (innerWidth - TL) / 2, y: innerHeight / 2 }; }
function fit() {
  const pad = 10;
  fitK = Math.min((innerWidth - TL - pad * 2) / (bb.x1 - bb.x0), (innerHeight - pad * 2) / (bb.y1 - bb.y0));
  KMIN = fitK * 0.4;
  k = fitK;
  tx = TL + (innerWidth - TL - (bb.x1 - bb.x0) * k) / 2 - bb.x0 * k;
  ty = (innerHeight - (bb.y1 - bb.y0) * k) / 2 - bb.y0 * k;
  apply();
}
function zoomAt(cx, cy, f) {
  const nk = clamp(k * f, KMIN, KMAX);
  const r = nk / k;
  tx = cx - (cx - tx) * r;
  ty = cy - (cy - ty) * r;
  k = nk;
}
function animateTo(tk, ttx, tty, ms) {
  const id = ++anim, k0 = k, x0 = tx, y0 = ty, t0 = performance.now();
  (function step(now) {
    if (id !== anim) return;
    let p = Math.min(1, (now - t0) / ms);
    p = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    k = k0 + (tk - k0) * p; tx = x0 + (ttx - x0) * p; ty = y0 + (tty - y0) * p;
    apply();
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function focusNode(n) {
  const c = center();
  const fk = Math.max(fitK * 1.9, Math.min(2.4, (Math.min(innerWidth - TL, innerHeight) / 2 - 30) / 150));
  interacted = true;
  animateTo(fk, c.x - n.x * fk, c.y - n.y * fk, 550);
}
function updateLeaves() {
  let best = null, bd = 1e9;
  if (k >= fitK * 1.7) {
    const c = center();
    D.nodes.forEach(n => {
      const d = Math.hypot(tx + n.x * k - c.x, ty + n.y * k - c.y);
      if (d < bd) { bd = d; best = n; }
    });
    if (bd > Math.min(innerWidth, innerHeight) * 0.5) best = null;
  }
  D.nodes.forEach(n => leafGroups[n.id].classList.toggle("show", !!best && best.id === n.id));
}

stage.addEventListener("wheel", e => {
  e.preventDefault();
  interacted = true; anim++;
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018));
  zoomAt(e.clientX, e.clientY, f);
  apply();
}, { passive: false });

const ptrs = new Map();
let moved = 0, downTarget = null;
stage.addEventListener("pointerdown", e => {
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { moved = 0; downTarget = e.target; } else { moved = 99; }
  interacted = true; anim++;
});
stage.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  if (ptrs.size === 1) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    moved += Math.abs(dx) + Math.abs(dy);
    tx += dx; ty += dy;
    p.x = e.clientX; p.y = e.clientY;
    apply();
  } else if (ptrs.size === 2) {
    const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
    const pd = Math.hypot(p.x - other.x, p.y - other.y);
    const pmx = (p.x + other.x) / 2, pmy = (p.y + other.y) / 2;
    p.x = e.clientX; p.y = e.clientY;
    const nd = Math.hypot(p.x - other.x, p.y - other.y);
    const mx = (p.x + other.x) / 2, my = (p.y + other.y) / 2;
    if (pd > 0) zoomAt(mx, my, nd / pd);
    tx += mx - pmx; ty += my - pmy;
    apply();
  }
});
function endPointer(e, isCancel) {
  const wasSingle = ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (!isCancel && wasSingle && moved < 6) tap(downTarget);
}
stage.addEventListener("pointerup", e => endPointer(e, false));
stage.addEventListener("pointercancel", e => endPointer(e, true));

function tap(target) {
  if (!target || !target.closest) return;
  const lf = target.closest(".lesson-leaf");
  if (lf) { openLesson(lf.getAttribute("data-node"), lf.getAttribute("data-kind")); return; }
  const nd = target.closest(".node");
  if (nd) focusNode(byId[nd.getAttribute("data-id")]);
}

$("zin").onclick = () => { const c = center(); interacted = true; anim++; zoomAt(c.x, c.y, 1.4); apply(); };
$("zout").onclick = () => { const c = center(); interacted = true; anim++; zoomAt(c.x, c.y, 1 / 1.4); apply(); };
$("zfit").onclick = () => { interacted = false; anim++; fit(); };
addEventListener("resize", () => { if (!interacted) fit(); else { fitK = Math.min((innerWidth - TL - 20) / (bb.x1 - bb.x0), (innerHeight - 20) / (bb.y1 - bb.y0)); KMIN = fitK * 0.4; apply(); } });

/* ================= lessons: predict, then see ================= */
const lessonEl = $("lesson"), lbody = $("lbody");
let cur = { lang: null, kind: null, i: 0 };

function openLesson(lang, kind) {
  cur = { lang: lang, kind: kind, i: 0 };
  lessonEl.hidden = false;
  renderLesson();
}
function closeLesson() { lessonEl.hidden = true; }
$("close").onclick = closeLesson;
lessonEl.addEventListener("click", e => { if (e.target === lessonEl) closeLesson(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeLesson(); });

function renderLesson() {
  const list = D.lessons[cur.lang][cur.kind];
  const lang = D.langs.find(l => l.id === cur.lang);

  const head = $("lhead");
  head.replaceChildren(H("div", "mini"), H("h2", "", lang.name));

  const kp = $("kindPills");
  kp.replaceChildren();
  KINDS.forEach(kk => {
    const b = H("button", "chip" + (kk[0] === cur.kind ? " on" : ""), kk[2]);
    b.onclick = () => { cur.kind = kk[0]; cur.i = 0; renderLesson(); };
    kp.appendChild(b);
  });

  const dots = $("dots");
  dots.replaceChildren();
  list.forEach((_, j) => dots.appendChild(H("span", "dot" + (j < cur.i ? " done" : j === cur.i ? " here" : ""))));

  lbody.replaceChildren();
  if (cur.i >= list.length) renderDone(); else renderExercise(list[cur.i], list.length);
}

function renderDone() {
  const wrap = H("div", "done-card");
  wrap.append(H("div", "check", "✓"), H("div", "nice", "Nice!"));
  const acts = H("div", "actions");
  const idx = KINDS.findIndex(kk => kk[0] === cur.kind);
  if (idx < KINDS.length - 1) {
    const nxt = H("button", "big", "Next: " + KINDS[idx + 1][2] + " →");
    nxt.onclick = () => { cur.kind = KINDS[idx + 1][0]; cur.i = 0; renderLesson(); };
    acts.appendChild(nxt);
  }
  const again = H("button", "big ghost", "↺ Again");
  again.onclick = () => { cur.i = 0; renderLesson(); };
  acts.appendChild(again);
  wrap.appendChild(acts);
  lbody.appendChild(wrap);
}

function simulate(sim, tile) {
  const el = H("div", "sim");
  let msg = "";
  if (sim.kind === "range") {
    const b = Number(tile);
    const last = sim.inclusive ? b : b - 1;
    el.appendChild(H("span", "simlabel", "prints"));
    const count = Math.max(0, last + 1);
    for (let j = 0; j < Math.min(count, 10); j++) {
      const bd = H("span", "badge", String(j));
      bd.style.animationDelay = (j * 90) + "ms";
      el.appendChild(bd);
    }
    if (count === 0) el.appendChild(H("span", "badge bad", "nothing"));
    msg = (count === 0 ? "Prints nothing." : "Prints 0 to " + last + ".") + " We want 0 to " + (sim.expect - 1) + ".";
  } else if (sim.kind === "cond") {
    const test = { ">=": a => a >= 18, ">": a => a > 18, "<": a => a < 18, "==": a => a === 18 }[tile];
    let first = null;
    [16, 18, 20].forEach((age, j) => {
      const got = test(age) ? "Adult" : "Minor", want = age >= 18 ? "Adult" : "Minor";
      const ok = got === want;
      if (!ok && !first) first = "Age " + age + " gives " + got + ". It should be " + want + ".";
      const bd = H("span", "badge " + (ok ? "good" : "bad"), "age " + age + " → " + got + (ok ? " ✓" : " ✗"));
      bd.style.animationDelay = (j * 120) + "ms";
      el.appendChild(bd);
    });
    msg = first || "";
  } else if (sim.kind === "fn") {
    const r = { "+": 5, "-": -1, "*": 6 }[tile];
    const ok = r === 5;
    el.appendChild(H("span", "badge", "add(2, 3)"));
    el.appendChild(H("span", "simlabel", "→"));
    el.appendChild(H("span", "badge " + (ok ? "good" : "bad"), String(r)));
    msg = "add(2, 3) gives " + r + ". We want 5.";
  }
  return { el: el, msg: msg };
}

function renderExercise(ex, total) {
  let solved = false, misses = 0;
  lbody.appendChild(H("p", "goal", ex.goal));

  const pre = H("pre", "code");
  const slot = H("span", "slot", "?");
  ex.lines.forEach(line => {
    const d = H("div", "ln");
    const parts = line.split(BLANK);
    parts.forEach((txt, j) => {
      if (j > 0) d.appendChild(slot);
      if (txt) d.appendChild(document.createTextNode(txt));
    });
    if (!line) d.textContent = " ";
    pre.appendChild(d);
  });
  lbody.appendChild(pre);

  const tiles = H("div", "tiles");
  const btns = ex.tiles.map(t => {
    const b = H("button", "tile", t);
    b.onclick = () => pick(t, b);
    tiles.appendChild(b);
    return b;
  });
  lbody.appendChild(tiles);

  const fb = H("div"); fb.id = "fb";
  const actions = H("div", "actions");
  lbody.append(fb, actions);

  function pick(tile, btn) {
    if (solved) return;
    const ok = tile === ex.answer;
    slot.textContent = tile;
    slot.className = "slot filled " + (ok ? "ok" : "bad");
    btns.forEach(b => { b.className = "tile"; });
    btn.className = "tile sel " + (ok ? "ok" : "bad");
    fb.replaceChildren();
    let msg;
    if (ex.sim) {
      const r = simulate(ex.sim, tile);
      fb.appendChild(r.el);
      msg = ok ? ex.note : (r.msg || ex.wrong[tile] || "Not quite. Try another.");
    } else {
      msg = ok ? ex.note : (ex.wrong[tile] || "Not quite. Try another.");
    }
    fb.appendChild(H("p", "msg " + (ok ? "good" : "oops"), (ok ? "✓ " : "✗ ") + msg));
    actions.replaceChildren();
    if (ok) {
      solved = true;
      btns.forEach(b => { b.disabled = true; });
      const dotEls = $("dots").children;
      if (dotEls[cur.i]) dotEls[cur.i].className = "dot done";
      const last = cur.i === total - 1;
      const nx = H("button", "big", last ? "Finish ✓" : "Next →");
      nx.onclick = () => { cur.i++; renderLesson(); };
      actions.appendChild(nx);
    } else {
      misses++;
      if (misses >= 2) {
        const sh = H("button", "big ghost", "Show answer");
        sh.onclick = () => pick(ex.answer, btns[ex.tiles.indexOf(ex.answer)]);
        actions.appendChild(sh);
      }
    }
  }
}

fit();
})();
</script>
